# config.example.ini
# -------------------
# Machine-specific PATHS for the BNS visualization driver.
#
#   cp config.example.ini config.ini     # then edit config.ini for your machine
#
# This is a plain config file (INI format), NOT a shell script — the values are
# read by the scripts, not executed. config.ini is gitignored, so your local
# paths never get committed. Only paths live here; all run settings (sections,
# units, movie options) stay in BNS_all.sh.

[paths]
# Parent directory containing the output-XXXX restart-segment subdirectories,
# e.g.  <simpath>/output-0000/, <simpath>/output-0001/, ...
simpath = /lus/flare/projects/CompactBinaryMerger/yiqiu/Large_sim/SFHo_highres/184_mb32_n64

# Optional: where to write rendered frames and movies.
# Leave blank to use the default, <simpath>/Figs.
figpath =
