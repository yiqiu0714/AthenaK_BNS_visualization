# config.example.ini
# -------------------
# Machine-specific PATHS for the BNS visualization driver.
#
#   cp config.example.ini config.ini     # then edit config.ini for your machine
#
# This is a plain config file (INI format). Values are read by the scripts, not
# executed — with ONE exception: the [env] env_setup command below, which is
# run to activate your Python/ffmpeg toolchain. config.ini is gitignored, so
# your local paths never get committed. All run settings (sections, units,
# movie options) stay in BNS_all.sh; ALL machine-specific settings live here.

[env]
# The single environment-activation command run before Python starts (via eval).
# Set this to whatever provides python + numpy/matplotlib/scipy (+ ffmpeg).
# Chain multiple commands with '&&' or ';'.
#   Perlmutter (NERSC):  module load python          # conda bundles the libs
#   Aurora:              module load python py-numpy py-matplotlib py-scipy py-h5py
#   generic venv:        source ~/venvs/bns/bin/activate
#   conda:               conda activate bns
# NOTE: sph_data_analysis also needs `vtk`, which the bare module/conda Python
# usually lacks. Point env_setup at a venv that has vtk, or add it via
# pythonpath_extra below. (A venv built from the module Python is simplest.)
env_setup = module load python

[paths]
# Parent directory containing the output-XXXX restart-segment subdirectories,
# e.g.  <simpath>/output-0000/, <simpath>/output-0001/, ...
simpath = /lus/flare/projects/CompactBinaryMerger/yiqiu/Large_sim/SFHo_highres/184_mb32_n64

# Optional: where to write rendered frames and movies.
# Leave blank to use the default, <simpath>/Figs.
figpath =

# --- Used only by sph_data_analysis/run_analysis.sh ---

# PyCompOSE HDF5 EOS table, required for the ejecta step.
# LEAVE BLANK (recommended): run_analysis.sh then reads the table the run
# actually used out of its own .bin outputs, which embed the parfile -- so an
# SFHo run gets the SFHo table and a DD2 run the DD2 table with no edit here.
# Set a path only to override that.
#
# Either way it must be the PyCompOSE HDF5 twin of the .athtab named by the
# parfile's <mhd> `table`. Only the .athtab is needed to run AthenaK, so the
# .h5 is often absent; rebuild it from the .athtab (they hold the same data):
#   python3 sph_data_analysis/athtab_to_h5.py /path/to/SFHo.athtab /path/to/SFHo.h5
eos_table =

# Merger time [M_sun] for the SPH analysis. LEAVE BLANK to compute it as the
# peak of |h22| (strain from psi4); a restart that stops before merger then
# uses its restart parent's waveform. Set it only to force a value.
t_merger =
# ADM mass [M_sun] used to shift the GW peak to retarded time (tortoise radius
# of the extraction sphere). Blank = 2.7 (THC default). M135_M135 DD2: 2.675.
m_adm =

# Optional: extra directory prepended to PYTHONPATH for packages the module
# Python doesn't provide. Used by sph_data_analysis (standalone vtk) AND by
# BNS_3d.sh, which needs pyvista / h5py / vtk / imageio-ffmpeg.
#
# On Aurora the python module is a venv (no --user installs), so install into
# this directory with --target, then point pythonpath_extra at it:
#   module load python/3.12.12 py-pip
#   python3.12 -m pip install --target ~/.python-extra/py312 \
#       pyvista imageio-ffmpeg h5py
#   pythonpath_extra = /home/<you>/.python-extra/py312
# Leave blank if these are already importable.
pythonpath_extra =
